# ==============================================================================
# CONFIGURACION NGINX - SISTEMA DE TURNOS CLINICOS (DAW UNER 2026)
# Despliegue en Produccion: Nginx actuando como Servidor Web para Angular SPA
# y Reverse Proxy hacia la API REST en NestJS (puerto 3000)
# ==============================================================================

server {
    listen 80;
    server_name clinica.uner.edu.ar localhost;

    # Ruta de publicacion del frontend compilado (ajustable segun Windows o Linux)
    # En Windows: C:/nginx/html o ruta relativa del proyecto compilado
    root /var/www/clinica-turnos/frontend/dist/frontend/browser;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. Reverse Proxy hacia la API NestJS y Swagger interactivo
    # El modificador ^~ asegura máxima precedencia para que los estáticos de Swagger (.js, .css)
    # se envíen directamente al backend y no sean interceptados por la regla de estáticos local
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 2. Ruteo Single Page Application (SPA Fallback de Angular)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. Cache de archivos estáticos del Frontend
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Manejo de errores
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

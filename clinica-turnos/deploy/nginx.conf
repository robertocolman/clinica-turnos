# ==============================================================================
# CONFIGURACION NGINX - SISTEMA DE TURNOS CLINICOS
# Despliegue en Produccion (P1: Roberto Colman)
# Servidor web para SPA Angular y Proxy Inverso hacia NestJS (Puerto 3000)
# ==============================================================================

server {
    listen 80;
    server_name clinica.uner.edu.ar localhost;

    root /var/www/clinica-turnos/frontend/dist/frontend/browser;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/docs/ {
        proxy_pass http://127.0.0.1:3000/api/docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
